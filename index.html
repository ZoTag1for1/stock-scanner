<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบสแกนสินค้าคงคลัง</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 0 16px; }
  button { padding: 12px 16px; margin: 6px 0; font-size: 18px; width: 100%; border-radius: 8px; border: none; }
  .in { background: #d4edda; }
  .out { background: #f8d7da; }
  .capture { background: #007bff; color: white; font-weight: bold; }
  #preview { width: 100%; margin-top: 10px; border-radius: 8px; display: none; }
  #result { margin-top: 16px; padding: 12px; border-radius: 6px; background: #eee; }
</style>
</head>
<body>
  <h2>สแกนบาร์โค้ดสินค้า</h2>

  <p>โหมด:
    <button class="in" onclick="setMode('in')">รับเข้า (Stock In)</button>
    <button class="out" onclick="setMode('out')">จำหน่ายออก (Stock Out)</button>
  </p>
  <p>โหมดปัจจุบัน: <span id="modeLabel">รับเข้า</span></p>

  <button class="capture" id="openCameraBtn" onclick="openCamera()">📷 เปิดกล้องสแกน</button>
  <button class="capture" id="captureBtn" onclick="captureAndScan()" style="display:none; background:#28a745;">📸 ถ่ายเพื่ออ่านบาร์โค้ด</button>
  <button id="closeCameraBtn" onclick="closeCamera()" style="display:none; background:#6c757d; color:white;">✖ ปิดกล้อง</button>

  <video id="video" autoplay playsinline style="width:100%; margin-top:10px; border-radius:8px; display:none;"></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <div id="result">ผลลัพธ์จะแสดงตรงนี้</div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyGJyq76Efd3OC_o5gL6fAKUcbWzTzb4N9zpjPubt8YpTvWwq9J5H-5Luep08PAMxtxaA/exec';
    let mode = 'in';

    function setMode(m) {
      mode = m;
      document.getElementById('modeLabel').innerText = m === 'in' ? 'รับเข้า' : 'จำหน่ายออก';
    }

    let currentStream = null;

    function openCamera() {
      const box = document.getElementById('result');
      box.innerText = '🎥 กำลังเปิดกล้อง...';

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }
      })
      .then(stream => {
        currentStream = stream;
        const video = document.getElementById('video');
        video.srcObject = stream;
        video.style.display = 'block';

        document.getElementById('openCameraBtn').style.display = 'none';
        document.getElementById('captureBtn').style.display = 'block';
        document.getElementById('closeCameraBtn').style.display = 'block';
        box.innerText = '📍 เล็งกล้องไปที่บาร์โค้ด แล้วกด "ถ่ายเพื่ออ่านบาร์โค้ด"';
      })
      .catch(err => {
        console.error('เปิดกล้องไม่สำเร็จ:', err);
        box.innerText = '❌ เปิดกล้องไม่สำเร็จ: ' + err.message + ' (ตรวจสอบว่าอนุญาตสิทธิ์กล้องแล้ว และเว็บต้องเป็น https)';
      });
    }

    function closeCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
      document.getElementById('video').style.display = 'none';
      document.getElementById('openCameraBtn').style.display = 'block';
      document.getElementById('captureBtn').style.display = 'none';
      document.getElementById('closeCameraBtn').style.display = 'none';
      document.getElementById('result').innerText = 'ผลลัพธ์จะแสดงตรงนี้';
    }

    function captureAndScan() {
      const box = document.getElementById('result');
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');

      // ย่อขนาดภาพก่อนสแกน (ตัวใหญ่สุด 900px) เพื่อให้อ่านบาร์โค้ดเร็วขึ้นมาก
      const MAX_DIM = 900;
      let w = video.videoWidth;
      let h = video.videoHeight;
      if (w > h && w > MAX_DIM) {
        h = Math.round(h * (MAX_DIM / w));
        w = MAX_DIM;
      } else if (h > MAX_DIM) {
        w = Math.round(w * (MAX_DIM / h));
        h = MAX_DIM;
      }
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(video, 0, 0, w, h);

      box.innerText = '🔍 กำลังอ่านบาร์โค้ด...';

      // กันเหนียว: ถ้าสแกนนานเกิน 6 วินาทีให้แจ้งเตือนแทนที่จะค้างเฉยๆ
      let timedOut = false;
      const timeoutId = setTimeout(() => {
        timedOut = true;
        box.innerText = '⏱️ อ่านบาร์โค้ดนานเกินไป ลองขยับเข้าใกล้/เล็งให้ตรงแล้วถ่ายใหม่';
      }, 6000);

      canvas.toBlob(blob => {
        const file = new File([blob], 'capture.jpg', { type: 'image/jpeg' });
        Html5Qrcode.scanFile(file, false)
          .then(decodedText => {
            if (timedOut) return; // ผลมาช้าเกินไป ผู้ใช้กดถ่ายใหม่ไปแล้ว
            clearTimeout(timeoutId);
            const qty = prompt('พบบาร์โค้ด: ' + decodedText + '\nใส่จำนวน:', '1');
            if (!qty) {
              box.innerText = '📍 เล็งกล้องไปที่บาร์โค้ด แล้วกด "ถ่ายเพื่ออ่านบาร์โค้ด"';
              return;
            }
            sendToServer(decodedText, qty);
          })
          .catch(err => {
            if (timedOut) return;
            clearTimeout(timeoutId);
            box.innerText = '❌ อ่านบาร์โค้ดไม่ได้ ลองเล็งให้ชัดขึ้น ใกล้ขึ้น หรือหลบแสงสะท้อน แล้วถ่ายใหม่';
          });
      }, 'image/jpeg', 0.85);
    }

    function sendToServer(barcode, qty) {
      const box = document.getElementById('result');
      box.innerText = '📡 กำลังส่งข้อมูลไปเซิร์ฟเวอร์...';

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ barcode: barcode, type: mode, qty: qty })
      })
      .then(res => {
        // ถ้า Apps Script ตอบกลับมาไม่ใช่ 200 (เช่นหน้า login ของ Google) ให้โยน error ทันที
        if (!res.ok) {
          throw new Error('เซิร์ฟเวอร์ตอบกลับสถานะ ' + res.status);
        }
        return res.text(); // ใช้ text() ก่อนเพื่อดักกรณีที่ไม่ใช่ JSON จริง
      })
      .then(text => {
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          console.error('ข้อมูลที่ได้ไม่ใช่ JSON:', text);
          throw new Error('รูปแบบข้อมูลจาก Apps Script ไม่ถูกต้อง (อาจตั้งค่า deploy ผิด)');
        }
        if (data.status === 'success') {
          box.innerText = `✅ ${data.product} — คงเหลือ ${data.newQty} ชิ้น`;
        } else {
          box.innerText = `❌ ${data.message || 'ไม่ทราบสาเหตุ'}`;
        }
      })
      .catch(err => {
        console.error('sendToServer error:', err);
        box.innerText = '❌ เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: ' + err.message;
      });
    }
  </script>
</body>
</html>
