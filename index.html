<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบสแกนสินค้าคงคลัง</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 0 16px; }
  button { padding: 12px 16px; margin: 6px 0; font-size: 18px; width: 100%; border-radius: 8px; border: none; }
  .in { background: #d4edda; }
  .out { background: #f8d7da; }
  .capture { background: #007bff; color: white; font-weight: bold; }
  #reader { width: 100%; margin-top: 10px; }
  #result { margin-top: 16px; padding: 12px; border-radius: 6px; background: #eee; white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>สแกนบาร์โค้ดสินค้า</h2>

  <p>โหมด:
    <button class="in" onclick="setMode('in')">รับเข้า (Stock In)</button>
    <button class="out" onclick="setMode('out')">จำหน่ายออก (Stock Out)</button>
  </p>
  <p>โหมดปัจจุบัน: <span id="modeLabel">รับเข้า</span></p>

  <button class="capture" id="openCameraBtn" onclick="openCamera()">📷 เปิดกล้องสแกน</button>
  <button id="closeCameraBtn" onclick="closeCamera()" style="display:none; background:#6c757d; color:white;">✖ ปิดกล้อง</button>

  <div id="reader"></div>

  <div id="result">ผลลัพธ์จะแสดงตรงนี้</div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyGJyq76Efd3OC_o5gL6fAKUcbWzTzb4N9zpjPubt8YpTvWwq9J5H-5Luep08PAMxtxaA/exec';
    let mode = 'in';

    // แสดง error จริงบนหน้าจอทุกครั้งที่โค้ดพัง จะได้เห็นสาเหตุจริงเสมอ
    window.addEventListener('error', function (e) {
      const box = document.getElementById('result');
      if (box) box.innerText = '⚠️ โค้ดพัง: ' + e.message;
    });
    window.addEventListener('unhandledrejection', function (e) {
      const box = document.getElementById('result');
      if (box) box.innerText = '⚠️ เกิดข้อผิดพลาด: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    });

    function setMode(m) {
      mode = m;
      document.getElementById('modeLabel').innerText = m === 'in' ? 'รับเข้า' : 'จำหน่ายออก';
    }

    let html5QrCode = null;
    let isProcessing = false; // กันไม่ให้เด้ง prompt ซ้ำตอนเจอบาร์โค้ดเดิมซ้ำๆ ในเฟรมถัดไป

    function openCamera() {
      const box = document.getElementById('result');
      box.innerText = '🎥 กำลังเปิดกล้อง...';

      html5QrCode = new Html5Qrcode('reader');

      html5QrCode.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 280, height: 160 }
        },
        (decodedText) => {
          if (isProcessing) return; // เจอซ้ำระหว่างรอ prompt เดิม ไม่ต้องทำอะไรอีก
          isProcessing = true;

          html5QrCode.pause(true); // หยุดสแกนชั่วคราวระหว่างถามจำนวน

          const qty = prompt('พบบาร์โค้ด: ' + decodedText + '\nใส่จำนวน:', '1');
          if (!qty) {
            box.innerText = '📍 เล็งกล้องไปที่บาร์โค้ด...';
            html5QrCode.resume();
            isProcessing = false;
            return;
          }

          sendToServer(decodedText, qty).finally(() => {
            html5QrCode.resume();
            isProcessing = false;
          });
        },
        () => {
          // เรียกทุกเฟรมที่ยังไม่เจอบาร์โค้ด — ไม่ต้องทำอะไร (เป็นเรื่องปกติ)
        }
      )
      .then(() => {
        document.getElementById('openCameraBtn').style.display = 'none';
        document.getElementById('closeCameraBtn').style.display = 'block';
        box.innerText = '📍 เล็งกล้องไปที่บาร์โค้ด ให้อยู่ในกรอบ ไม่ต้องกดถ่าย รอสักครู่ระบบจะอ่านให้อัตโนมัติ';
      })
      .catch(err => {
        box.innerText = '❌ เปิดกล้องไม่สำเร็จ: ' + err + ' (ตรวจสอบว่าอนุญาตสิทธิ์กล้องแล้ว และเว็บต้องเป็น https)';
      });
    }

    function closeCamera() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
        }).catch(() => {});
      }
      document.getElementById('openCameraBtn').style.display = 'block';
      document.getElementById('closeCameraBtn').style.display = 'none';
      document.getElementById('result').innerText = 'ผลลัพธ์จะแสดงตรงนี้';
    }

    function sendToServer(barcode, qty) {
      const box = document.getElementById('result');
      box.innerText = '📡 กำลังส่งข้อมูลไปเซิร์ฟเวอร์...';

      return fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ barcode: barcode, type: mode, qty: qty })
      })
      .then(res => {
        if (!res.ok) {
          throw new Error('เซิร์ฟเวอร์ตอบกลับสถานะ ' + res.status);
        }
        return res.text();
      })
      .then(text => {
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          console.error('ข้อมูลที่ได้ไม่ใช่ JSON:', text);
          throw new Error('รูปแบบข้อมูลจาก Apps Script ไม่ถูกต้อง (อาจตั้งค่า deploy ผิด)');
        }
        if (data.status === 'success') {
          box.innerText = `✅ ${data.product} — คงเหลือ ${data.newQty} ชิ้น\n\n📍 เล็งกล้องไปที่บาร์โค้ดชิ้นถัดไปได้เลย`;
        } else {
          box.innerText = `❌ ${data.message || 'ไม่ทราบสาเหตุ'}`;
        }
      })
      .catch(err => {
        console.error('sendToServer error:', err);
        box.innerText = '❌ เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: ' + err.message;
      });
    }
  </script>
</body>
</html>
